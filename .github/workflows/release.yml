name: Release

# Runs when develop (or hotfix) is merged into main. The version comes from the VERSION file:
# bump it in the merge. Maven Central is released automatically after validation. Each registry step is skipped when that version is already published,
# so the workflow can be re-run safely (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # Inert until the repository variable RELEASE_ENABLED is set to `true` (see RELEASING.md)
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "invalid VERSION: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  tag:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tags and a GitHub release (skipped if the tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "v$V already exists; nothing to tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `packages/go/vX.Y.Z` is what the Go module proxy needs for a module in a subdirectory
          git tag "v$V"
          git tag "packages/go/v$V"
          git push origin "v$V" "packages/go/v$V"
          gh release create "v$V" --title "v$V" --generate-notes

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish @comatype/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@comatype/typescript@$V" version >/dev/null 2>&1; then
            echo "@comatype/typescript@$V is already published"
            exit 0
          fi
          cd packages/typescript
          pnpm run build
          npm publish --access public --provenance

  go:
    # The Go module proxy serves tags: `packages/go/vX.Y.Z` is created by the tag job. Warm the proxy so the version is available right away.
    needs: [verify, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/oldsheeep3/comatype/packages/go@v$V" && exit 0
            sleep 20
          done
          echo "proxy.golang.org does not list the version yet (it will pick it up later)"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (configure it for this repository and the `pypi` environment)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - run: python -m pip install build && python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish comatype to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf -H "User-Agent: comatype-release" "https://crates.io/api/v1/crates/comatype/$V" >/dev/null; then
            echo "comatype $V is already published"
            exit 0
          fi
          cargo publish --manifest-path packages/rust/Cargo.toml --allow-dirty

  maven:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Publish net.sheeplab.comatype:comatype and comatype-ktx to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf "https://repo1.maven.org/maven2/net/sheeplab/comatype/comatype/$V/comatype-$V.pom" >/dev/null; then
            echo "net.sheeplab.comatype:comatype:$V is already published"
            exit 0
          fi
          gradle -p packages publishToMavenCentral -PreleaseVersion="$V" --no-configuration-cache --console=plain

  rubygems:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The RubyGems.org account that owns the gem. Trusted publishing needs it to CREATE a gem (first release only).
      RUBYGEMS_OWNER_ID: "255802"
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (this repository and workflow are registered as a trusted publisher)
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish comatype to RubyGems
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf "https://rubygems.org/api/v1/versions/comatype.json" | grep -q "\"number\":\"$V\""; then
            echo "comatype $V is already published"
            exit 0
          fi
          # Exchange the GitHub OIDC token for a short-lived RubyGems API key (the official action cannot pass `owner`)
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)"
          resp="$(curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}')")"
          key="$(printf '%s' "$resp" | jq -r '.rubygems_api_key // empty')"
          if [ -z "$key" ]; then
            echo "::error::token exchange failed: $(printf '%s' "$resp" | jq -r '.error // .message // .' 2>/dev/null | head -c 300)"
            exit 1
          fi
          echo "::add-mask::$key"
          cd packages/ruby
          gem build comatype.gemspec
          GEM_HOST_API_KEY="$key" gem push comatype-*.gem

  vscode:
    # Builds the .vsix, attaches it to the GitHub release and publishes it to the VS Code Marketplace and Open VSX.
    # A registry whose secret is missing (VSCE_PAT, OVSX_PAT) is skipped with a notice instead of failing the release.
    needs: [verify, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the GitHub release
    env:
      V: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter comatype
      - run: ./scripts/set-version.sh "$V"
      - name: Build the .vsix
        run: |
          # The Marketplace does not accept semver pre-release versions such as 0.1.0-rc.1
          if [[ "$V" == *-* ]]; then
            echo "::notice::VS Code extension: $V is a pre-release version; nothing is built or published"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          pnpm --dir editors/vscode package
      - name: Attach the .vsix to the GitHub release
        if: env.SKIP != 'true'
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "editors/vscode/comatype-$V.vsix" --clobber
          else
            echo "::notice::release v$V does not exist; the .vsix is not attached"
          fi
      - name: Publish to the VS Code Marketplace
        if: env.SKIP != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::secret VSCE_PAT is not set; skipping the VS Code Marketplace"
            exit 0
          fi
          cd editors/vscode
          if pnpm exec vsce show comatype.comatype --json 2>/dev/null | jq -e --arg v "$V" '[.versions[].version] | index($v)' >/dev/null; then
            echo "comatype.comatype@$V is already published to the VS Code Marketplace"
            exit 0
          fi
          pnpm exec vsce publish --packagePath "comatype-$V.vsix" --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.SKIP != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::secret OVSX_PAT is not set; skipping Open VSX"
            exit 0
          fi
          if curl -sf "https://open-vsx.org/api/comatype/comatype/$V" >/dev/null; then
            echo "comatype.comatype@$V is already published to Open VSX"
            exit 0
          fi
          cd editors/vscode
          pnpm exec ovsx publish "comatype-$V.vsix" --pat "$OVSX_PAT"
