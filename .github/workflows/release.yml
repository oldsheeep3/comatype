name: Release

# Runs when develop (or hotfix) is merged into main. The version comes from the VERSION file:
# bump it in the merge. Maven Central is released automatically after validation. Each registry step is skipped when that version is already published,
# so the workflow can be re-run safely (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # Inert until the repository variable RELEASE_ENABLED is set to `true` (see RELEASING.md)
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "invalid VERSION: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  tag:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create tags and a GitHub release (skipped if the tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "v$V already exists; nothing to tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `packages/go/vX.Y.Z` is what the Go module proxy needs for a module in a subdirectory
          git tag "v$V"
          git tag "packages/go/v$V"
          git push origin "v$V" "packages/go/v$V"
          gh release create "v$V" --title "v$V" --generate-notes

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish @comatype/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@comatype/typescript@$V" version >/dev/null 2>&1; then
            echo "@comatype/typescript@$V is already published"
            exit 0
          fi
          cd packages/typescript
          pnpm run build
          npm publish --access public --provenance
      - name: Publish @comatype/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@comatype/javascript@$V" version >/dev/null 2>&1; then
            echo "@comatype/javascript@$V is already published"
            exit 0
          fi
          cd packages/javascript
          pnpm run build
          npm publish --access public --provenance

  go:
    # The Go module proxy serves tags: `packages/go/vX.Y.Z` is created by the tag job. Warm the proxy so the version is available right away.
    needs: [verify, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/oldsheeep3/comatype/packages/go@v$V" && exit 0
            sleep 20
          done
          echo "proxy.golang.org does not list the version yet (it will pick it up later)"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (configure it for this repository and the `pypi` environment)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - run: python -m pip install build && python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          skip-existing: true

  crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish comatype to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf -H "User-Agent: comatype-release" "https://crates.io/api/v1/crates/comatype/$V" >/dev/null; then
            echo "comatype $V is already published"
            exit 0
          fi
          cargo publish --manifest-path packages/rust/Cargo.toml --allow-dirty

  maven:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Publish net.sheeplab.comatype:comatype and comatype-ktx to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf "https://repo1.maven.org/maven2/net/sheeplab/comatype/comatype/$V/comatype-$V.pom" >/dev/null; then
            echo "net.sheeplab.comatype:comatype:$V is already published"
            exit 0
          fi
          gradle -p packages publishToMavenCentral -PreleaseVersion="$V" --no-configuration-cache --console=plain

  rubygems:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The RubyGems.org account that owns the gem. Trusted publishing needs it to CREATE a gem (first release only).
      RUBYGEMS_OWNER_ID: "255802"
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (this repository and workflow are registered as a trusted publisher)
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish comatype to RubyGems
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf "https://rubygems.org/api/v1/versions/comatype.json" | grep -q "\"number\":\"$V\""; then
            echo "comatype $V is already published"
            exit 0
          fi
          # Exchange the GitHub OIDC token for a short-lived RubyGems API key (the official action cannot pass `owner`)
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)"
          resp="$(curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}')")"
          key="$(printf '%s' "$resp" | jq -r '.rubygems_api_key // empty')"
          if [ -z "$key" ]; then
            echo "::error::token exchange failed: $(printf '%s' "$resp" | jq -r '.error // .message // .' 2>/dev/null | head -c 300)"
            exit 1
          fi
          echo "::add-mask::$key"
          cd packages/ruby
          gem build comatype.gemspec
          GEM_HOST_API_KEY="$key" gem push comatype-*.gem

  nuget:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Publish Comatype to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          if curl -sf "https://api.nuget.org/v3-flatcontainer/comatype/index.json" | jq -e --arg v "$V" '.versions | index($v)' >/dev/null; then
            echo "Comatype $V is already published"
            exit 0
          fi
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not set, so Comatype $V is not published to NuGet"
            exit 0
          fi
          dotnet pack packages/csharp/Comatype.csproj -c Release -o nupkg
          dotnet nuget push "nupkg/Comatype.$V.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # The comatype CLI as a ready-to-run binary for every platform: attached to the GitHub release (and installed by
  # install.sh) and bundled into the platform builds of the VS Code extension. No Rust toolchain needed to use it.
  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, vscode: linux-x64, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, vscode: linux-arm64, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest, vscode: darwin-x64 }
          - { target: aarch64-apple-darwin, os: macos-latest, vscode: darwin-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, vscode: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Stamp the version
        shell: bash
        run: ./scripts/set-version.sh "${{ needs.verify.outputs.version }}"
      - name: Build
        run: cargo build --release -p comatype-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: ./scripts/package-cli.sh ${{ matrix.target }} ${{ matrix.vscode }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Attach the CLI archives (and their SHA256SUMS) to the GitHub release created by the tag job.
  cli-release:
    needs: [verify, tag, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true
      - name: Upload to the release
        run: |
          cd artifacts
          sha256sum comatype-*.tar.gz comatype-*.zip > SHA256SUMS
          cat SHA256SUMS
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$V" comatype-*.tar.gz comatype-*.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "::notice::release v$V does not exist; the binaries are not attached"
          fi

  vscode:
    # Builds the .vsix files (one per platform with the comatype binary bundled, and a universal one without it),
    # attaches them to the GitHub release and publishes them to the VS Code Marketplace and Open VSX.
    # A registry whose secret is missing (VSCE_PAT, OVSX_PAT) is skipped with a notice instead of failing the release.
    needs: [verify, tag, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix files to the GitHub release
    env:
      V: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter comatype
      - run: ./scripts/set-version.sh "$V"
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true
      - name: Build the .vsix files
        run: |
          # The Marketplace does not accept semver pre-release versions such as 0.1.0-rc.1
          if [[ "$V" == *-* ]]; then
            echo "::notice::VS Code extension: $V is a pre-release version; nothing is built or published"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            ./scripts/package-vsix.sh "$t" "artifacts/comatype-bin-$t"
          done
          ./scripts/package-vsix.sh win32-x64 artifacts/comatype-bin-win32-x64.exe
          ./scripts/package-vsix.sh universal   # fallback for platforms without a bundled binary
          ls -la editors/vscode/*.vsix
      - name: Attach the .vsix files to the GitHub release
        if: env.SKIP != 'true'
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" editors/vscode/*.vsix --clobber
          else
            echo "::notice::release v$V does not exist; the .vsix files are not attached"
          fi
      - name: Publish to the VS Code Marketplace
        if: env.SKIP != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::secret VSCE_PAT is not set; skipping the VS Code Marketplace"
            exit 0
          fi
          cd editors/vscode
          if pnpm exec vsce show comatype.comatype --json 2>/dev/null | jq -e --arg v "$V" '[.versions[].version] | index($v)' >/dev/null; then
            echo "comatype.comatype@$V is already published to the VS Code Marketplace"
            exit 0
          fi
          pnpm exec vsce publish --packagePath comatype-*.vsix --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.SKIP != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::secret OVSX_PAT is not set; skipping Open VSX"
            exit 0
          fi
          if curl -sf "https://open-vsx.org/api/comatype/comatype/$V" >/dev/null; then
            echo "comatype.comatype@$V is already published to Open VSX"
            exit 0
          fi
          cd editors/vscode
          for f in comatype-*.vsix; do
            pnpm exec ovsx publish "$f" --pat "$OVSX_PAT"
          done
