name: Binaries check

# Builds the CLI for every release platform on pull requests that could break it, so that the Release workflow
# does not find out first. Nothing is uploaded.
on:
  pull_request:
    branches: [develop, main, hotfix]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/binaries-check.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/package-vsix.sh"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p comatype-cli --target ${{ matrix.target }}
      - name: Run the binary
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          # the x64 macOS binary runs on the arm64 runner through Rosetta; the others run natively
          "$out/comatype$ext" help | head -1
          "$out/comat$ext" help | head -1
