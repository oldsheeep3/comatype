name: CI

on:
  pull_request:
    branches: [develop, main, hotfix]
  push:
    branches: [develop, hotfix]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: TypeScript, JavaScript, JSON, CSS (Biome)
        run: pnpm lint:js
      - name: Rust (rustfmt, clippy)
        run: pnpm lint:rust
      - name: Go (gofmt, vet)
        run: pnpm lint:go
      - name: Package READMEs are up to date
        run: python3 scripts/readmes/gen.py --check
      - name: Python (ruff)
        run: |
          python -m pip install ruff
          ruff check packages/python
          ruff format --check packages/python
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Java and Kotlin (Spotless)
        run: gradle -p packages spotlessCheck --console=plain
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Ruby (RuboCop)
        run: |
          gem install rubocop
          cd packages/ruby && rubocop

  lint-swift:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Swift (swift-format)
        run: swift format lint --strict -r packages/swift/Sources

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build -p comatype-cli
      - name: Rust runtime tests
        run: cargo test --manifest-path packages/rust/Cargo.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p comatype-cli
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript runtime
        run: pnpm --dir packages/typescript typecheck && pnpm --dir packages/typescript test && pnpm --dir packages/typescript build && pnpm --dir packages/javascript build
      - name: VS Code extension (test, then build the .vsix without publishing it)
        run: |
          pnpm --dir editors/vscode test
          ./scripts/package-vsix.sh universal
          ./scripts/package-vsix.sh linux-x64 target/debug/comatype   # the platform build with a binary bundled
          unzip -l editors/vscode/comatype-linux-x64-*.vsix | grep -q "extension/bin/comatype"
      - name: Website (typecheck, build, test)
        run: pnpm --dir docs check
      - name: Sample project
        run: pnpm --dir usage install --frozen-lockfile && pnpm --dir usage check

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: packages/go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e packages/python pytest pytest-asyncio mypy
          python -m pytest packages/python
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Java and Kotlin runtimes
        run: gradle -p packages :java:selfTest :kotlin:build --console=plain
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: C# runtime
        run: |
          dotnet build packages/csharp/Comatype.csproj -c Release
          dotnet format whitespace packages/csharp/Comatype.csproj --verify-no-changes
          ./scripts/test-csharp.sh
