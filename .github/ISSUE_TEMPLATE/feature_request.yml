name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: If it changes `.comat`, a short example of the syntax helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
