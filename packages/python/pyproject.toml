[project]
name = "comatype-api"
version = "0.0.1"
description = "Comatype runtime for Python (client `c` and server `s`)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "oldsheeep3" }]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/oldsheeep3/comatype"
Repository = "https://github.com/oldsheeep3/comatype"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comatype"]

[tool.setuptools.package-data]
comatype = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
