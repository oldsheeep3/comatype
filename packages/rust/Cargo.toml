[package]
name = "comatype"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Comatype runtime for Rust (client `c` and server `s`)"
repository = "https://github.com/oldsheeep3/comatype"
homepage = "https://github.com/oldsheeep3/comatype"
readme = "README.md"
keywords = ["api", "codegen", "http", "types", "validation"]
categories = ["web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = "2"

[workspace]
